# AI Shorts Factory — tüm servisler
#   Yerel / geliştirme : docker compose up -d                 (portlar yalnızca 127.0.0.1'e bağlı)
#   Sunucu (HTTPS)     : docker compose --profile https up -d (Caddy, Let's Encrypt sertifikası alır)
name: ai-shorts-factory

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP üzerinden: ilk kurulumdaki geçici (yalnızca soket) sunucuyu "hazır" saymaz
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 10s
      retries: 10

  # Her başlangıçta: kullanıcı/veritabanı/şema yoksa oluşturur, şifreleri .env ile eşitler
  db-init:
    image: postgres:17-alpine
    restart: "no"
    logging: *logging
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?}
      FACTORY_DB_PASSWORD: ${FACTORY_DB_PASSWORD:?}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]

  n8n:
    image: n8nio/n8n:2.45.4
    restart: unless-stopped
    logging: *logging
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      N8N_LISTEN_ADDRESS: 0.0.0.0
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      N8N_HOST: ${N8N_DOMAIN:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678}/
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-0}
      GENERIC_TIMEZONE: ${TIMEZONE:-Europe/Istanbul}
      TZ: ${TIMEZONE:-Europe/Istanbul}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/renders
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      N8N_PAYLOAD_SIZE_MAX: "512"
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/renders:/data/renders:ro
      - ./n8n:/import:ro

  factory-api:
    image: ai-shorts-factory-factory-api
    build: ./services/factory
    restart: unless-stopped
    logging: *logging
    depends_on: { db-init: { condition: service_completed_successfully } }
    env_file: .env
    environment:
      FACTORY_DATABASE_URL: postgresql://factory:${FACTORY_DB_PASSWORD}@postgres:5432/factory
      WORKER_URL: http://video-worker:8100
      MEDIA_ROOT: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data

  video-worker:
    image: ai-shorts-factory-video-worker
    build: ./services/video-worker
    restart: unless-stopped
    logging: *logging
    environment:
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?}
      MEDIA_ROOT: /data
      WORKER_MAX_PARALLEL: ${WORKER_MAX_PARALLEL:-1}
    volumes:
      - ./data:/data
    # dış dünyaya port açılmaz; yalnızca iç ağdan erişilir

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: { db-init: { condition: service_completed_successfully } }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./data/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M)
          for db in n8n factory; do
            pg_dump -h postgres -U postgres -Fc $$db > /backups/$$db-$$ts.dump && echo "backup $$db-$$ts ok"
          done
          find /backups -name '*.dump' -mtime +$$KEEP_DAYS -delete
          sleep 86400
        done

  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    restart: unless-stopped
    logging: *logging
    depends_on: [n8n, factory-api]
    environment:
      N8N_DOMAIN: ${N8N_DOMAIN}
      PANEL_DOMAIN: ${PANEL_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  n8n_data:
  caddy_data:
